<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Notewell: two lanes and a kanban card crossing between them, forming an N. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26344a"/>
      <stop offset="1" stop-color="#121923"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe3ee"/>
      <stop offset="1" stop-color="#bcc8d7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78adfb"/>
      <stop offset="1" stop-color="#4d8ced"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-25%" width="180%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="62" y="56" width="44" height="144" rx="14" fill="url(#lane)"/>
  <rect x="150" y="56" width="44" height="144" rx="14" fill="url(#lane)"/>
  <!-- The card: the lanes' rounded-rectangle shape (40x140, rx 11), tilted 33 degrees from
       vertical so its outer corners meet the top of the first lane and the bottom of the second.
       The shadow is the same rectangle in the same frame, moved 4px straight down on the page
       ((2.18, 3.35) in the rotated frame) and blurred. -->
  <g transform="translate(128 128) rotate(-33)">
    <rect x="-17.82" y="-66.65" width="40" height="140" rx="11" fill="#060a10" fill-opacity="0.35" filter="url(#shadow)"/>
    <rect x="-20" y="-70" width="40" height="140" rx="11" fill="url(#card)"/>
    <rect x="-19.25" y="-69.25" width="38.5" height="138.5" rx="10.25" fill="none" stroke="#ffffff" stroke-opacity="0.19" stroke-width="1.5"/>
  </g>
</svg>
